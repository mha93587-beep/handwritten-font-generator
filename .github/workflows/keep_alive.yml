name: Keep 1 Streamlit Apps Awake 24/7 (Real Browser WebSocket)

on:
  schedule:
    # Run every 10 minutes to maintain real WebSocket browser sessions
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Playwright Real Browser Keep-Alive & Auto-Wakeup
        run: |
          node .github/workflows/keep_alive.js
